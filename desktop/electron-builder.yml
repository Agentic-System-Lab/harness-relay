# Installers for the desktop app (`npm run desktop:dist`, and the Release workflow), for the system it
# runs on. They are not signed for distribution: see docs/user-guide.md, "Desktop app".
appId: io.github.agentic-system-lab.harness-relay
productName: Harness Relay
copyright: Copyright © 2026 ChihYu Yeh
directories:
  app: build/app
  buildResources: build/resources
  output: release
# The server stays outside the app archive: a utility process loads it from Resources/server.
extraResources:
  - from: build/server
    to: server
  # electron-builder always leaves out a node_modules folder at the top of what it copies, so the
  # keyring module (native code, not bundled into server.mjs) is copied as its own folder.
  - from: build/server/node_modules
    to: server/node_modules
  # The license, where people can open it (the same file is in the app's archive, beside its package.json).
  - from: build/app/LICENSE
    to: LICENSE
npmRebuild: false
electronFuses:
  # Nobody may run the app's binary as plain Node (macOS would let that code use the app's privacy permissions).
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  # The app's code only from its archive, and the archive only as built (macOS and Windows check it).
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  # The window shows the server's pages only, never file:, so file: pages get no extra privileges.
  grantFileProtocolExtraPrivileges: false
  # Cookie encryption stays off: the window's cookie and key are in a folder of their own that agents
  # below full access may not read (desktop/src/profile.ts), localStorage (the key) would not be
  # encrypted anyway, and on an app signed ad hoc macOS would ask for the keychain after every update.
  # desktop/scripts/check-package.ts reads these back from the packaged app.
mac:
  target: dmg
  category: public.app-category.developer-tools
  # Signed ad hoc, the same on every computer (not with a certificate found in the keychain): Apple
  # Silicon runs no unsigned code, and the fuses above change the binary after it was linked.
  identity: '-'
  # The microphone, for voice input in the chat's window: the hardened runtime needs the entitlement,
  # and macOS shows the reason (Info.plist, translated in macos/*.lproj) when it asks.
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  extendInfo:
    # Starts in the menu bar only: the Dock icon shows while the chat's window is open.
    LSUIElement: true
    NSMicrophoneUsageDescription: 'Harness Relay uses the microphone for voice input: your speech is turned into text on this computer.'
  extraResources:
    - from: macos/en.lproj/InfoPlist.strings
      to: en.lproj/InfoPlist.strings
    - from: macos/zh_TW.lproj/InfoPlist.strings
      to: zh_TW.lproj/InfoPlist.strings
win:
  target: nsis
nsis:
  oneClick: true
  perMachine: false
linux:
  target: AppImage
  category: Development
