name: End-to-end tests

# The UI in a real browser against the real server (npm run test:e2e), with a fake for each of the ten
# agent CLIs (e2e/fake-cli/), on Linux, macOS and Windows: no agent is paid for and nothing signs in.
# Below full access the open agents' fakes run in Harness Relay's own sandbox for real (Linux, macOS).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      browsers:
        description: 'Browsers, comma-separated (chromium, firefox, webkit)'
        default: chromium
        required: false
      every_cli:
        description: "Every CLI's own tests on macOS and Windows too, not only the CLIs each system runs differently from Linux"
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  # A new push to a pull request replaces its running check; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: End-to-end (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24]
        # The oldest supported major (package.json engines: >=22.13) too, on Linux.
        include:
          - os: ubuntu-latest
            node: 22
    env:
      E2E_BROWSERS: ${{ inputs.browsers || 'chromium' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # The browsers Playwright drives (headless: Chromium's headless shell, not the whole browser),
      # and on Linux the system libraries they need. Not on Windows: there --with-deps only adds
      # Windows Server's Media Foundation, for media no test plays, and that takes three minutes.
      - name: Install the browsers
        shell: bash
        run: |
          deps=''
          if [ "$RUNNER_OS" = Linux ]; then deps=--with-deps; fi
          npx playwright install $deps --only-shell ${E2E_BROWSERS//,/ }

      # Harness Relay's own sandbox, which the open agents run in below full access (docs/sandboxing.md):
      # bubblewrap, socat and ripgrep on Linux, and where Ubuntu restricts unprivileged user namespaces
      # (23.10 and later) the AppArmor profile that lets /usr/bin/bwrap make them. Nothing to install on
      # macOS; none on Windows, where the open agents run only with full access.
      - name: Set up Harness Relay's sandbox (Linux)
        if: runner.os == 'Linux'
        run: |
          missing=$(for p in bubblewrap socat ripgrep; do dpkg -s "$p" >/dev/null 2>&1 || echo "$p"; done)
          if [ -n "$missing" ]; then sudo apt-get update -q && sudo apt-get install -y -q $missing; fi
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
            sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
          bwrap --ro-bind / / true && echo "bubblewrap works"

      # The real sandbox's own checks (what it lets through, as a table), before the tests that rely on it.
      # On Linux only: on GitHub's macOS runners (macOS 26.7) curl cannot verify a certificate inside
      # the sandbox, so the checks that reach example.com through its proxy fail there, while Node's
      # fetch passes (not seen on macOS 26.6). The tests themselves reach no host on the internet, and
      # still run the open agents in the sandbox on macOS.
      - name: Check Harness Relay's sandbox
        if: runner.os == 'Linux'
        run: npx tsx scripts/sandbox-check.ts

      - name: Build the UI
        run: npm run build

      # And a development build (React's StrictMode runs each effect twice, as under npm run dev), made
      # as e2e/global-setup.ts makes it, for the specs that serve it (DEV_WEB_DIR in e2e/support/paths.ts).
      - name: Build the UI for development
        run: npx vite build --outDir ../../dist/web-dev --emptyOutDir --logLevel error
        env:
          NODE_ENV: development

      - name: Run the end-to-end tests
        run: npm run test:e2e
        env:
          # Built in the steps above.
          E2E_BUILD: never
          # A test that needs Harness Relay's own sandbox fails, not skips, when it cannot run here.
          E2E_REQUIRE_RELAY_SANDBOX: ${{ runner.os != 'Windows' && '1' || '' }}
          # Each CLI's own tests on the systems its facts name (testedOn in e2e/support/clis/<cli>.ts):
          # all ten on Linux; on macOS and Windows those Harness Relay runs differently there.
          E2E_SYSTEM_CLIS: ${{ !inputs.every_cli && '1' || '' }}

      # The HTML report, and for a failed test its trace, screenshot, video, server log and the fake
      # CLIs' log: `npx playwright show-report <folder>` or `npx playwright show-trace <trace.zip>`.
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
