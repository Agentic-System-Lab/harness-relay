name: End-to-end tests

# The UI in a real browser against the real server (npm run test:e2e), with fake claude, codex and
# grok CLIs (e2e/fake-cli/), on Linux, macOS and Windows: no agent is paid for and nothing signs in.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      browsers:
        description: 'Browsers, comma-separated (chromium, firefox, webkit)'
        default: chromium
        required: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  # A new push to a pull request replaces its running check; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: End-to-end (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24]
        # The oldest supported major (package.json engines: >=22.13) too, on Linux.
        include:
          - os: ubuntu-latest
            node: 22
    env:
      E2E_BROWSERS: ${{ inputs.browsers || 'chromium' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # The browsers Playwright drives, and on Linux the system libraries they need.
      - name: Install the browsers
        shell: bash
        run: npx playwright install --with-deps ${E2E_BROWSERS//,/ }

      - name: Build the UI
        run: npm run build

      - name: Run the end-to-end tests
        run: npm run test:e2e
        env:
          # Built in the step above.
          E2E_BUILD: never

      # The HTML report, and for a failed test its trace, screenshot, video, server log and the fake
      # CLIs' log: `npx playwright show-report <folder>` or `npx playwright show-trace <trace.zip>`.
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
