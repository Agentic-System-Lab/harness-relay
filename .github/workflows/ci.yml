name: CI

# Every pull request and every push to main (including merges) must typecheck, pass the tests
# and build.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request replaces its running check; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported major (package.json engines: >=22.13) and the current LTS.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The desktop app (desktop/) is a package of its own. Its tests run with the others above;
      # here it is typechecked and built, and its bundled server is run the way the app runs it (no
      # installer, and no Electron binary is downloaded).
      - name: Install the desktop app's tools
        run: npm ci --prefix desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Typecheck the desktop app
        run: npm run desktop:typecheck

      - name: Build the desktop app
        run: npm --prefix desktop run build

      - name: Run the bundled server as the desktop app does
        run: npx tsx desktop/scripts/smoke.ts
