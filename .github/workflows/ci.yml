name: CI

# Every pull request and every push to main (including merges) must typecheck, pass the tests
# and build, on Linux and on Windows; the desktop app is also packaged for Linux and Windows and
# checked as a release is, a question to its agents (fake CLIs) included.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request replaces its running check; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported major (package.json engines: >=22.13) and the current LTS.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The desktop app (desktop/) is a package of its own. Its tests run with the others above;
      # here it is typechecked and built, and its bundled server is run the way the app runs it (no
      # installer, and no Electron binary is downloaded).
      - name: Install the desktop app's tools
        run: npm ci --prefix desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Typecheck the desktop app
        run: npm run desktop:typecheck

      - name: Build the desktop app
        run: npm --prefix desktop run build

      - name: Run the bundled server as the desktop app does
        run: npx tsx desktop/scripts/smoke.ts

  # The desktop app ships for Windows, so the tests run there too: Git for Windows' defaults (CRLF
  # line endings), Windows paths and processes. Tests of what only macOS or Linux have are skipped.
  windows:
    name: Typecheck, test, build (Windows, Node 24)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The tests' temporary folders (git repositories, worktrees, many small files) on D:, the
      # runner's own disk that the checkout is on, rather than C: (TEMP's own drive, as home's).
      # The end-to-end tests (e2e.yml) keep TEMP on C:, and home stays there for these too, so a
      # path read on another drive than the checkout's is still tried.
      - name: Test
        run: npm test
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}

      - name: Build
        run: npm run build

  desktop-package:
    name: Package the desktop app and check it (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            target: --linux dir --x64
          # As the Release workflow builds the Arm64 AppImage: on GitHub's Arm runner.
          - name: Linux arm64
            os: ubuntu-24.04-arm
            target: --linux dir --arm64
          # Windows on Arm is checked by the Release workflow (windows-11-arm).
          - name: Windows x64
            os: windows-latest
            target: --win dir --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install
        run: npm ci

      # electron-builder downloads the Electron it packages by itself.
      - name: Install the desktop app's tools
        run: npm ci --prefix desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # With a made-up token for the app's updates (fine-grained in form, put together here so that no
      # token's text stands in this file), so that the check below finds it in none of the server's
      # files, and in the app's own only encoded, as in a release built with one.
      - name: Build the web app and the desktop app
        shell: bash
        run: |
          export RELAY_UPDATES_TOKEN="github_pat_$(printf 'ci%.0s' {1..20})"
          npm run build && npm --prefix desktop run build

      # The app as electron-builder packages it (unpacked: no installer), with the fuses, the archive
      # and the resources of a release, then checked as the Release workflow checks it.
      - name: Package the app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.target }} --publish never

      # Its fuses, its resources and its own check (--smoke-test), with the fake CLIs of the
      # end-to-end tests answering a question (on Windows built as executables first).
      - name: Check the packaged app
        if: runner.os != 'Linux'
        run: npx tsx desktop/scripts/check-package.ts

      - name: Check the packaged app (Linux, on a virtual display)
        if: runner.os == 'Linux'
        run: |
          # A virtual display and Electron's own libraries: GitHub's x64 image has them, its Arm image not all.
          missing=$(for p in xvfb libnss3 libgtk-3-0t64 libgbm1 libasound2t64; do dpkg -s "$p" >/dev/null 2>&1 || echo "$p"; done)
          if [ -n "$missing" ]; then sudo apt-get update -q && sudo apt-get install -y -q $missing; fi
          xvfb-run -a npx tsx desktop/scripts/check-package.ts
