name: Pages

# Publishes the landing page in site/ to GitHub Pages whenever it, or the demo videos it plays,
# change on main.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/media/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The landing page's address, where each page's canonical address starts.
  SITE: https://agentic-system-lab.github.io/harness-relay/
  # IndexNow's key, which proves the pages ours to the search engines told of their changes. Not a
  # secret: site/<key>.txt serves it, and a new key needs that file renamed with it
  # (docs/developer-guide.md, "Website" → "Search engines").
  INDEXNOW_KEY: 8de13cb3ba2dccfb84c9d81d70aab5b9

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # The page plays the demo videos from docs/media, so they are copied in rather than stored twice.
      # Markdown (the design guidelines), image provenance sidecars and type declarations (for the
      # tests) stay in the repository only.
      - name: Assemble the site
        run: |
          mkdir -p _site/media
          cp -R site/. _site/
          cp docs/media/demo-en.mp4 docs/media/demo-zh-TW.mp4 _site/media/
          find _site \( -name '*.md' -o -name '*.webp.json' -o -name '*.d.ts' \) -delete
          find _site -type f | sort

      # IndexNow is told only of the pages a deployment adds, changes or removes, as its protocol asks:
      # each page of the new sitemap whose HTML is not the one live now (or that cannot be read there: a
      # new page, or the site unreachable), and each page the live sitemap lists and the new one does not.
      # Read before the deployment replaces them.
      - name: Find the pages the deployment changes
        run: |
          live=$(mktemp -d)
          changed="$RUNNER_TEMP/changed-pages"
          : > "$changed"
          locs() { sed -n 's#.*<loc>\([^<]*\)</loc>.*#\1#p' "$1"; }
          locs _site/sitemap.xml > "$live/new-pages"
          while read -r url; do
            file="_site/${url#"$SITE"}"
            case "$file" in */) file="${file}index.html" ;; esac
            if ! curl -fsS --max-time 30 -o "$live/page" "$url" || ! cmp -s "$live/page" "$file"; then
              echo "$url" >> "$changed"
            fi
          done < "$live/new-pages"
          if curl -fsS --max-time 30 -o "$live/sitemap.xml" "${SITE}sitemap.xml"; then
            locs "$live/sitemap.xml" | grep -vxF -f "$live/new-pages" >> "$changed" || true
          fi
          if [ -s "$changed" ]; then
            echo "The deployment changes:"
            cat "$changed"
          else
            echo "The deployment changes no page."
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5

      # api.indexnow.org passes the pages on to every search engine that takes part (Bing among them;
      # Google takes no part). The key file is at the top of the site, below the domain's root, which
      # makes the key good for the pages under it: all of the site's. The site is out by now, so a
      # failure only warns: the engines find the change when they next read the sitemap. 202 is
      # IndexNow's answer while it has yet to check the key file, as at first.
      - name: Tell IndexNow which pages changed
        run: |
          changed="$RUNNER_TEMP/changed-pages"
          if [ ! -s "$changed" ]; then
            echo "No page changed: IndexNow is not told."
            exit 0
          fi
          host=${SITE#https://}
          host=${host%%/*}
          key_file="${SITE}${INDEXNOW_KEY}.txt"
          urls=$(sed 's/.*/"&"/' "$changed" | paste -sd , -)
          body="$RUNNER_TEMP/indexnow.json"
          printf '{"host":"%s","key":"%s","keyLocation":"%s","urlList":[%s]}' "$host" "$INDEXNOW_KEY" "$key_file" "$urls" > "$body"
          err=$(mktemp)
          code=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json; charset=utf-8' --data-binary "@$body" https://api.indexnow.org/indexnow 2>"$err") || true
          case "$code" in
            200|202)
              echo "IndexNow was told of $(grep -c . "$changed") changed page(s) (HTTP $code)."
              exit 0 ;;
            400) why='HTTP 400: the request is not as the protocol has it' ;;
            403) why="HTTP 403: the key is not the one $key_file serves" ;;
            422) why="HTTP 422: a page is not under $SITE, or the key is not as the protocol has it" ;;
            429) why='HTTP 429: too many requests' ;;
            ''|000) why="no answer: $(tail -n 1 "$err")" ;;
            *) why="HTTP $code" ;;
          esac
          message="IndexNow was not told of the changed pages ($why): the search engines find them when they next read the sitemap."
          echo "::warning::$message"
          echo "$message" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
