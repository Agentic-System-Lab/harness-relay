name: Release

# Run by hand: Actions → Release → Run workflow, from main, with today's version (see
# docs/developer-guide.md, "Releasing"). It checks the version (scripts/release.ts) and the code,
# builds the desktop app's installers on macOS, Windows and Linux (x64, and Arm64 on GitHub's Arm
# runners), and publishes the five as one GitHub release, tagged with the version; first, a copy of
# each for the app's updates (counted apart from new installs) under the same tag in a repository of
# their own (the UPDATES_REPO variable, else UPDATES_REPO in site/assets/downloads.js), with the
# UPDATES_TOKEN secret; the app downloads them with the UPDATES_READ_TOKEN secret, when that is set
# (for a private one), which must not be the write token and is checked to read them before the
# release is published. A release candidate is published as a pre-release. Its notes list every
# commit that came into main since the version before (scripts/release.ts notes), pushed to main or
# merged from a pull request. When the website has a download mirror (MIRROR in
# site/assets/downloads.js), a release's installers go there too before it is published, with the
# MIRROR_ACCESS_KEY_ID and MIRROR_SECRET_ACCESS_KEY secrets.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Today's date in Taiwan: YYYY-MM-DD for a release, then .1, .2… for the same day's patches; -rc after either for a release candidate of it, then .1, .2… for its patches (npm run release:next prints them)"
        required: true
        type: string

permissions:
  contents: read

# One release at a time, so that two runs cannot take the same version.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # The day of a release, and so its version, is the day in this time zone (RELEASE_TIME_ZONE in
  # scripts/release.ts).
  RELEASE_TIME_ZONE: Asia/Taipei
  # The download mirror's R2 bucket (bucket_name in mirror/wrangler.toml).
  MIRROR_BUCKET: harness-relay-downloads

defaults:
  run:
    shell: bash

jobs:
  # The write token (UPDATES_TOKEN) in a job of its own, with nothing checked out and nothing installed:
  # a runner keeps the secrets a job names for the whole job, so a job that runs npm's packages must
  # never name it. Only the release job's step that publishes the copies names it besides.
  tokens:
    name: Check the update tokens
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The copies are published with it after the builds: a release without it stops here, at once,
      # rather than some 30 minutes later.
      - name: Expect the write token
        env:
          WRITE_TOKEN: ${{ secrets.UPDATES_TOKEN }}
        run: |
          if [ -z "${WRITE_TOKEN//[[:space:]]/}" ]; then
            echo "::error::The UPDATES_TOKEN secret is not set: the copies for the app's updates are published with it (docs/developer-guide.md, \"Releasing\")."
            exit 1
          fi

      # The read token goes into every installer, where anyone can read it, and the build legs upload
      # theirs as artifacts: never the write token, with which anyone could replace the copies. The
      # likeliest slip is the same token set as both, caught here before anything is built, compared as
      # the build reads them (trimmed), in the shell alone. A different token that may write is not
      # caught here (docs/developer-guide.md, "Releasing").
      - name: Refuse a read token that is the write token
        env:
          WRITE_TOKEN: ${{ secrets.UPDATES_TOKEN }}
          READ_TOKEN: ${{ secrets.UPDATES_READ_TOKEN }}
        run: |
          trim() { local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          read=$(trim "$READ_TOKEN")
          write=$(trim "$WRITE_TOKEN")
          if [ -n "$read" ] && [ "$read" = "$write" ]; then
            echo "::error::UPDATES_READ_TOKEN is the same token as UPDATES_TOKEN, which may write to the copies' repository, and it would go into every installer. Revoke that token and make two: one that may only read the copies' repository for UPDATES_READ_TOKEN, one that may write there for UPDATES_TOKEN (docs/developer-guide.md, \"Releasing\"), then run the workflow again."
            exit 1
          fi

      # Anyone with the app has the read token, and may use up its account's requests (5,000 an hour):
      # when that account also owns the write token, publishing the copies is held up with it. Warned
      # about, not refused (an account of its own is best: docs/developer-guide.md, "Releasing"), and
      # also when GitHub does not say whose they are (a token expired or revoked, say). Each token goes to
      # curl on its standard input, never in its arguments, which other programs could read.
      - name: Warn when the read token's account also owns the write token
        env:
          WRITE_TOKEN: ${{ secrets.UPDATES_TOKEN }}
          READ_TOKEN: ${{ secrets.UPDATES_READ_TOKEN }}
        run: |
          trim() { local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          owner() {
            printf 'Authorization: Bearer %s\n' "$1" | curl -fsS --max-time 30 -H @- -H 'Accept: application/vnd.github+json' https://api.github.com/user |
              grep -o '"login": *"[^"]*"' | head -n 1 | sed 's/.*"\([^"]*\)"$/\1/'
          }
          read=$(trim "$READ_TOKEN")
          write=$(trim "$WRITE_TOKEN")
          if [ -z "$read" ] || [ -z "$write" ]; then exit 0; fi
          reader=$(owner "$read" || true)
          writer=$(owner "$write" || true)
          if [ -z "$reader" ] || [ -z "$writer" ]; then
            echo "::warning::Could not tell which accounts UPDATES_READ_TOKEN and UPDATES_TOKEN belong to (GitHub did not say)."
          elif [ "$reader" = "$writer" ]; then
            echo "::warning::UPDATES_READ_TOKEN and UPDATES_TOKEN both belong to $reader. Anyone with the app can use up that account's requests with the read token, and publishing the copies with the write token is then held up too: make the read token with an account of its own (docs/developer-guide.md, \"Releasing\")."
          fi

  check:
    name: Check the version and the code
    needs: tokens
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      title: ${{ steps.version.outputs.title }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      today: ${{ steps.version.outputs.today }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # First, so that a wrong version fails in seconds. The version reaches the script through the
      # environment, never inside the command line itself (no script injection).
      - name: Check the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/release.ts check "$VERSION" --remote

      # The update source the builds will take, checked before anything is installed: a read token that
      # is not a fine-grained one, or a repository that is not owner/name (or is this one), stops the run
      # here rather than in each build; and so does one that cannot read that repository's releases (no
      # access to it or to its contents, expired, revoked, waiting for an organization's approval), or a
      # private repository without one, asked of GitHub as an app would (repositoryReadable; without a
      # read token, with this job's own in its place). The repository's own code alone, no dependencies; the read token is public anyway.
      - name: Check the update source
        env:
          GH_TOKEN: ${{ github.token }}
          RELAY_UPDATES_REPO: ${{ vars.UPDATES_REPO }}
          RELAY_UPDATES_TOKEN: ${{ secrets.UPDATES_READ_TOKEN }}
        run: |
          node --input-type=module -e "
          import { repositoryReadable, updateSourceFrom } from './desktop/src/updateSource.ts';
          const source = updateSourceFrom({ RELAY_UPDATES_REPO: process.env.RELAY_UPDATES_REPO, RELAY_UPDATES_TOKEN: process.env.RELAY_UPDATES_TOKEN });
          if (!source.ok) { console.error('::error::' + source.error); process.exit(1); }
          const { error, warning } = await repositoryReadable(fetch, { source: source.value, token: process.env.GH_TOKEN });
          if (warning) console.log('::warning::' + warning);
          if (error) { console.error('::error::' + error); process.exit(1); }
          console.log('The app will download its updates from ' + source.value.repo + (source.value.token ? ', with the read token.' : ', without a token.'));"

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  build:
    name: Build (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS
            os: macos-latest
            # Macs with Apple Silicon only (the runner's own processor).
            target: --mac dmg --arm64
          - name: Windows
            os: windows-latest
            target: --win nsis --x64
          # Built on an Arm runner, so that npm installs the keyring module's native part for Arm
          # (@napi-rs/keyring-win32-arm64-msvc) and the packaged app's own check runs natively. On a
          # Dev Drive (the step "Make a Dev Drive to build on" below).
          - name: Windows Arm64
            os: windows-11-arm
            target: --win nsis --arm64
            devDrive: true
          - name: Linux
            os: ubuntu-latest
            target: --linux AppImage --x64
          # The same for Linux on Arm (@napi-rs/keyring-linux-arm64-gnu).
          - name: Linux Arm64
            os: ubuntu-24.04-arm
            target: --linux AppImage --arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # The version the app is built as (desktop/scripts/build.ts) and its installers are named after.
      RELAY_VERSION: ${{ needs.check.outputs.tag }}
      # Where it is built: the checkout, or its copy on a Dev Drive.
      BUILD_DIR: ${{ matrix.devDrive && 'R:\harness-relay' || github.workspace }}
    # These replace the workflow's defaults, so bash is named again.
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.BUILD_DIR }}
    steps:
      - uses: actions/checkout@v7

      # GitHub's Windows on Arm runner has one disk, which writes small files about 14 times slower
      # than a Dev Drive does (x64's runner builds on a fast disk of its own), and npm ci writes tens of
      # thousands: there the job builds in a copy of the checkout on a Dev Drive, with npm's cache and
      # the temporary folder, which makes installing about twice as fast. It holds only this job's
      # files, so no antivirus filter is attached to it.
      - name: Make a Dev Drive to build on
        if: matrix.devDrive
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          New-VHD -Path (Join-Path $env:RUNNER_TEMP 'dev-drive.vhdx') -SizeBytes 20GB -Dynamic | Mount-VHD -PassThru |
            Initialize-Disk -PassThru | New-Partition -DriveLetter R -UseMaximumSize | Format-Volume -DevDrive -Confirm:$false -Force | Out-Null
          fsutil devdrv enable /disallowAv
          fsutil devdrv trust /f R:
          Copy-Item -Path $env:GITHUB_WORKSPACE -Destination $env:BUILD_DIR -Recurse -Force
          New-Item -ItemType Directory -Path R:\npm-cache, R:\tmp | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value 'npm_config_cache=R:\npm-cache', 'TEMP=R:\tmp', 'TMP=R:\tmp'

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install
        run: npm ci

      # electron-builder downloads the Electron it packages by itself.
      - name: Install the desktop app's tools
        run: npm ci --prefix desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build the web app
        run: npm run build

      # Where the app downloads its updates from (desktop/src/updateSource.ts): the repository the
      # copies are published in below (the UPDATES_REPO variable, else UPDATES_REPO in
      # site/assets/downloads.js), with the UPDATES_READ_TOKEN secret when it is set, for a private one.
      # The token goes into every installer, where anyone can read it: it may read that repository's
      # contents and nothing else (docs/developer-guide.md, "Releasing"). In this job, this step and the
      # packaged app's checks below get it (and, before, the tokens job's two steps and the check job's
      # update-source check; after, the release job's two update checks).
      - name: Build the desktop app
        env:
          RELAY_UPDATES_REPO: ${{ vars.UPDATES_REPO }}
          RELAY_UPDATES_TOKEN: ${{ secrets.UPDATES_READ_TOKEN }}
        run: npm --prefix desktop run build

      # On each system: the bundled server listens, signs a browser in, has a team of the fake CLIs
      # (e2e/fake-cli/) answer a question and stops as the app needs.
      - name: Run the bundled server as the desktop app does
        run: npx tsx desktop/scripts/smoke.ts

      # Not signed for distribution: on macOS the app is signed ad hoc (desktop/electron-builder.yml;
      # Apple Silicon runs nothing unsigned), and no identity is looked for in the keychain.
      # The installers are named after the version: Harness-Relay-<version>-<os>-<arch>.<ext>.
      - name: Make the installer
        working-directory: ${{ env.BUILD_DIR }}/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.target }} --publish never -c.artifactName='Harness-Relay-${env.RELAY_VERSION}-${os}-${arch}.${ext}'

      # The packaged app itself, as it ships (desktop/scripts/check-package.ts): its fuses, the keyring
      # module in its resources, and its own check in Electron (--smoke-test: the server in a utility
      # process, a question answered by a team of the fake CLIs, a sandboxed window signed in). On
      # Linux it needs a display. Given what the app was built to download its updates with, it finds the
      # repository there and the read token encoded (and as text nowhere).
      - name: Check the packaged app
        if: runner.os != 'Linux'
        env:
          RELAY_UPDATES_REPO: ${{ vars.UPDATES_REPO }}
          RELAY_UPDATES_TOKEN: ${{ secrets.UPDATES_READ_TOKEN }}
        run: npx tsx desktop/scripts/check-package.ts

      - name: Check the packaged app (Linux, on a virtual display)
        if: runner.os == 'Linux'
        env:
          RELAY_UPDATES_REPO: ${{ vars.UPDATES_REPO }}
          RELAY_UPDATES_TOKEN: ${{ secrets.UPDATES_READ_TOKEN }}
        run: |
          # A virtual display and Electron's own libraries: GitHub's x64 image has them, its Arm image not all.
          missing=$(for p in xvfb libnss3 libgtk-3-0t64 libgbm1 libasound2t64; do dpkg -s "$p" >/dev/null 2>&1 || echo "$p"; done)
          if [ -n "$missing" ]; then sudo apt-get update -q && sudo apt-get install -y -q $missing; fi
          xvfb-run -a npx tsx desktop/scripts/check-package.ts

      # overwrite: a build run again in a later attempt replaces what it uploaded before.
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.name }}
          overwrite: true
          path: |
            ${{ env.BUILD_DIR }}/desktop/release/Harness-Relay-*.dmg
            ${{ env.BUILD_DIR }}/desktop/release/Harness-Relay-*.exe
            ${{ env.BUILD_DIR }}/desktop/release/Harness-Relay-*.AppImage
          if-no-files-found: error
          retention-days: 7

      # What this build downloads its updates with (desktop/scripts/build.ts: a fingerprint naming
      # neither the repository nor the token), for the release job to check against its own.
      - uses: actions/upload-artifact@v7
        with:
          name: update-source-${{ matrix.name }}
          overwrite: true
          path: ${{ env.BUILD_DIR }}/desktop/build/update-source.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # The pull request each commit in the notes merged (GitHub's commits/<sha>/pulls).
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Again, against the tags as they are now and the day the run started (a long build may end
      # after midnight): another release may have taken the version meanwhile.
      - name: Check the version again
        env:
          VERSION: ${{ needs.check.outputs.tag }}
          TODAY: ${{ needs.check.outputs.today }}
        run: node scripts/release.ts check "$VERSION" --remote --today "$TODAY"

      # The notes' list of changes: every commit that came into main since the version the notes
      # start from (previousVersion() in scripts/release.ts, by the same tags), up to the commit that
      # was checked and built, whether pushed to main or merged from a pull request, as GitHub's
      # comparison of the two lists them; each by its subject, linked to the pull request it merged or
      # else to itself. Before anything is published, so that a failure here publishes nothing.
      - name: List the changes since the version before
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.tag }}
        run: node scripts/release.ts notes "$VERSION" --target "$GITHUB_SHA" --remote > "$RUNNER_TEMP/changes.md"

      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true

      # One folder for each build's: checked against this run's below.
      - uses: actions/download-artifact@v8
        with:
          pattern: update-source-*
          path: update-sources

      # The ends of the installers' names are the ones the website and the app's updates look for
      # (INSTALLERS in site/assets/downloads.js).
      - name: Expect one installer per system and processor
        run: |
          ls -l installers
          ends=$(node --input-type=module -e "import { INSTALLERS } from './site/assets/downloads.js'; console.log(Object.values(INSTALLERS).join('\n'))")
          total=0
          for end in $ends; do
            count=$(find installers -maxdepth 1 -name "*$end" | wc -l)
            if [ "$count" -ne 1 ]; then
              echo "::error::Expected one installer ending in $end, found $count."
              exit 1
            fi
            total=$((total + 1))
          done
          if [ "$(find installers -maxdepth 1 -type f | wc -l)" -ne "$total" ]; then
            echo "::error::Expected $total installers, found others too."
            exit 1
          fi

      # The same installers again for the app's own updates, which download these instead
      # (UPDATE_INSTALLERS in site/assets/downloads.js): GitHub's download counts then tell new
      # installs from updates of an installed app. In a folder of their own: they are published in
      # another repository, so that the release page lists the installers alone.
      - name: Copy the installers for the app's updates
        run: |
          mkdir updates
          node --input-type=module -e "
          import { copyFileSync, readdirSync } from 'node:fs';
          import { updateCopyName } from './site/assets/downloads.js';
          for (const name of readdirSync('installers')) {
            const copy = updateCopyName(name);
            if (!copy) throw new Error('Not an installer: ' + name);
            copyFileSync('installers/' + name, 'updates/' + copy);
          }"
          ls -l updates

      # Every installer was built with this run's variable and secret (desktop/src/updateSource.ts,
      # sameUpdateSource): "Re-run failed jobs" builds nothing again that built before, so one changed
      # since would be checked below and not be in them. Before the copies are published, from the
      # fingerprints the builds left, which name neither the repository nor the token.
      - name: Check that the installers were built with this run's update source
        env:
          RELAY_UPDATES_REPO: ${{ vars.UPDATES_REPO }}
          RELAY_UPDATES_TOKEN: ${{ secrets.UPDATES_READ_TOKEN }}
        run: |
          node --input-type=module -e "
          import { readdirSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { sameUpdateSource, updateSourceFrom } from './desktop/src/updateSource.ts';
          const source = updateSourceFrom({ RELAY_UPDATES_REPO: process.env.RELAY_UPDATES_REPO, RELAY_UPDATES_TOKEN: process.env.RELAY_UPDATES_TOKEN });
          if (!source.ok) { console.error('::error::' + source.error); process.exit(1); }
          const built = readdirSync('update-sources', { recursive: true }).filter((f) => f.endsWith('update-source.txt')).map((f) => readFileSync(join('update-sources', f), 'utf8'));
          const changed = sameUpdateSource(built, source.value, readdirSync('installers').length);
          if (changed) { console.error('::error::' + changed); process.exit(1); }
          console.log('The ' + built.length + ' installers were built with this run\'s update source.');"

      # Before the release, so that no app is offered it before its copies are there (it would download
      # the installer itself, counted as a new install). Under the same tag in the repository the app
      # downloads them from, the one the build named (RELAY_UPDATES_REPO: the UPDATES_REPO variable,
      # else UPDATES_REPO in site/assets/downloads.js, read as desktop/src/updateSource.ts reads it),
      # with a token that may write there alone (UPDATES_TOKEN, see docs/developer-guide.md,
      # "Releasing"): this job's own token writes to this repository only. A run tried again uploads
      # the copies again.
      - name: Publish the copies for the app's updates
        env:
          GH_TOKEN: ${{ secrets.UPDATES_TOKEN }}
          RELAY_UPDATES_REPO: ${{ vars.UPDATES_REPO }}
          TAG: ${{ needs.check.outputs.tag }}
          TITLE: ${{ needs.check.outputs.title }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The UPDATES_TOKEN secret is not set (docs/developer-guide.md, \"Releasing\")."
            exit 1
          fi
          repo=$(node --input-type=module -e "
          import { updateSourceFrom } from './desktop/src/updateSource.ts';
          const source = updateSourceFrom({ RELAY_UPDATES_REPO: process.env.RELAY_UPDATES_REPO });
          if (!source.ok) { console.error('::error::' + source.error); process.exit(1); }
          console.log(source.value.repo);")
          if gh release view "$TAG" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$TAG" updates/* --repo "$repo" --clobber
          else
            channel=(--latest)
            if [ "$PRERELEASE" = true ]; then channel=(--prerelease --latest=false); fi
            notes="Copies of the installers of [$TITLE](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}), which an installed Harness Relay downloads to update itself. To install Harness Relay, download the installers there."
            gh release create "$TAG" updates/* --repo "$repo" --title "$TITLE" --notes "$notes" "${channel[@]}"
          fi

      # An app downloads the copies as it was built to (desktop/src/updateSource.ts, copiesReadable):
      # checked here, so that a read token missing, expired, waiting for an organization's approval or
      # without access to that repository stops the release before it is published, instead of every
      # update quietly counting as a new install. Each copy must be listed whole where the app will ask
      # for it (nothing is downloaded, so no download is counted): with the read token, else, as the app
      # then downloads from github.com without one, with this job's own token in its place, which reads
      # a public repository and no other's private one. A read token that expires soon is warned about.
      - name: Check that the app can download the copies
        env:
          GH_TOKEN: ${{ github.token }}
          RELAY_UPDATES_REPO: ${{ vars.UPDATES_REPO }}
          RELAY_UPDATES_TOKEN: ${{ secrets.UPDATES_READ_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          node --input-type=module -e "
          import { readdirSync, statSync } from 'node:fs';
          import { join } from 'node:path';
          import { copiesReadable, updateSourceFrom } from './desktop/src/updateSource.ts';
          const source = updateSourceFrom({ RELAY_UPDATES_REPO: process.env.RELAY_UPDATES_REPO, RELAY_UPDATES_TOKEN: process.env.RELAY_UPDATES_TOKEN });
          if (!source.ok) { console.error('::error::' + source.error); process.exit(1); }
          const copies = readdirSync('updates').map((name) => ({ name, size: statSync(join('updates', name)).size }));
          const { error, warning } = await copiesReadable(fetch, { source: source.value, tag: process.env.TAG, copies, token: process.env.GH_TOKEN });
          if (warning) console.log('::warning::' + warning);
          if (error) { console.error('::error::' + error); process.exit(1); }
          console.log('An app built with ' + (source.value.token ? 'the read token' : 'no token') + ' can download the ' + copies.length + ' copies from ' + source.value.repo + '.');"

      # The website's download buttons point at the download mirror when there is one (MIRROR in
      # site/assets/downloads.js: a Cloudflare Worker in front of an R2 bucket, mirror/worker.ts), as
      # GitHub's own downloads are slow in parts of the world. Before the release is published, so that
      # the website, which finds the newest release on GitHub, never offers one the mirror lacks; a
      # release only, as the website offers no release candidate. With an R2 API token that may read and
      # write that bucket alone (the MIRROR_ACCESS_KEY_ID and MIRROR_SECRET_ACCESS_KEY secrets), at the
      # account's S3 address (the MIRROR_ENDPOINT variable), through the runner's own AWS CLI: this job
      # installs no npm package. A run tried again uploads them again.
      - name: Upload the installers to the download mirror
        id: mirror
        env:
          TAG: ${{ needs.check.outputs.tag }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
          MIRROR_ENDPOINT: ${{ vars.MIRROR_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MIRROR_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MIRROR_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          mirror=$(node --input-type=module -e "
          import { MIRROR, isMirror } from './site/assets/downloads.js';
          if (MIRROR && !isMirror(MIRROR)) { console.error('::error::MIRROR in site/assets/downloads.js is not an https origin: ' + MIRROR); process.exit(1); }
          console.log(MIRROR);")
          if [ -z "$mirror" ]; then
            echo "No download mirror (MIRROR in site/assets/downloads.js is empty): the website offers GitHub's downloads."
            exit 0
          fi
          if [ "$PRERELEASE" = true ]; then
            echo "A release candidate: the website offers releases only, so the download mirror does not get it."
            exit 0
          fi
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$MIRROR_ENDPOINT" ]; then
            echo "::error::The download mirror ($mirror) needs the MIRROR_ACCESS_KEY_ID and MIRROR_SECRET_ACCESS_KEY secrets and the MIRROR_ENDPOINT variable (docs/developer-guide.md, \"Releasing\"); without a mirror, empty MIRROR in site/assets/downloads.js."
            exit 1
          fi
          for file in installers/*; do
            aws s3 cp "$file" "s3://$MIRROR_BUCKET/$TAG/$(basename "$file")" --endpoint-url "$MIRROR_ENDPOINT" --content-type application/octet-stream --no-progress --only-show-errors
          done
          echo "url=$mirror" >> "$GITHUB_OUTPUT"

      # Each installer served whole by the mirror itself, not sent on to GitHub: its last byte asked for
      # (a part from the first byte would be counted as a download on GitHub; a HEAD would not show that
      # the file can be read), and a redirect not followed.
      - name: Check that the download mirror serves the installers
        if: steps.mirror.outputs.url != ''
        env:
          MIRROR: ${{ steps.mirror.outputs.url }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          for file in installers/*; do
            name=$(basename "$file")
            size=$(stat -c %s "$file")
            expected="bytes $((size - 1))-$((size - 1))/$size"
            for attempt in 1 2 3; do
              got=$(curl -sS --max-time 30 -r -1 -o /dev/null -D - "$MIRROR/$TAG/$name" | tr -d '\r' | awk 'tolower($1) == "content-range:" { print $2 " " $3 }') || got=''
              if [ "$got" = "$expected" ]; then break; fi
              sleep 10
            done
            if [ "$got" != "$expected" ]; then
              echo "::error::The download mirror does not serve $name whole: $MIRROR/$TAG/$name answered Content-Range '$got' to a request for its last byte, not '$expected'."
              exit 1
            fi
          done
          echo "The download mirror serves the $(find installers -maxdepth 1 -type f | wc -l) installers."

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          TITLE: ${{ needs.check.outputs.title }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            channel=(--prerelease --latest=false)
            kind='A release candidate: try it before the release.'
            offered='A Harness Relay that is a release candidate (or a build of your own) offers this one in its menu (**Update to …**) and in its chat, and updates itself; a release is offered releases only.'
          else
            channel=(--latest)
            kind='A release.'
            offered='A Harness Relay already installed offers this release in its menu (**Update to …**) and in its chat, and updates itself.'
          fi
          notes="$kind

          **Download:** \`.dmg\` for macOS 13 or later on Apple Silicon (no Intel Macs), \`.exe\` for Windows 10 or later (\`win-x64\`, or \`win-arm64\` for Windows on Arm), \`.AppImage\` for Linux (\`linux-x86_64\`, or \`linux-arm64\` for Arm). The installers are not signed yet: on macOS, open **System Settings → Privacy & Security** and click **Open Anyway**; on Windows, click **More info → Run anyway**; on Linux, make the AppImage executable, and on Ubuntu 24.04 and later start it with \`--no-sandbox\`. $offered See [Desktop app](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/user-guide.md#desktop-app) ([繁體中文](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/user-guide.zh-TW.md#桌面-app))."
          # Then the changes since the version before (for a release, the release before it, its release
          # candidates' changes included; for a release candidate, the version before it, release or
          # release candidate), listed by the step above.
          printf '%s\n\n' "$notes" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/changes.md" >> "$RUNNER_TEMP/notes.md"
          # The tag is made on the commit that was checked and built.
          gh release create "$TAG" installers/* --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" "${channel[@]}"

      # The mirror keeps the newest two releases (by version): the one before may still be offered by a
      # page that kept it (for ten minutes), or be downloading. Older ones are removed, so that the bucket
      # stays within R2's free storage; the mirror sends their downloads to GitHub. After the release is
      # out, so a failure here only warns.
      - name: Remove older releases from the download mirror
        if: steps.mirror.outputs.url != ''
        env:
          MIRROR_ENDPOINT: ${{ vars.MIRROR_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MIRROR_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MIRROR_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if ! tags=$(aws s3api list-objects-v2 --bucket "$MIRROR_BUCKET" --delimiter / --endpoint-url "$MIRROR_ENDPOINT" --query 'CommonPrefixes[].Prefix' --output text); then
            echo "::warning::Could not list the download mirror's releases: older ones stay there."
            exit 0
          fi
          old=$(printf '%s\n' $tags | sed -n 's#/$##p' | sort -V | head -n -2)
          for tag in $old; do
            echo "Removing $tag from the download mirror."
            aws s3 rm "s3://$MIRROR_BUCKET/$tag/" --recursive --endpoint-url "$MIRROR_ENDPOINT" --only-show-errors || echo "::warning::Could not remove $tag from the download mirror."
          done
