name: Release

# Run by hand: Actions → Release → Run workflow, from main, with today's version (see
# docs/developer-guide.md, "Releasing"). It checks the version (scripts/release.ts) and the code,
# builds the desktop app's installers on macOS, Windows and Linux (x64, and Arm64 on GitHub's Arm
# runners), and publishes the five as one GitHub release, tagged with the version; first, a copy of
# each for the app's updates (counted apart from new installs) under the same tag in a repository of
# their own (UPDATES_REPO in site/assets/downloads.js), with the UPDATES_TOKEN secret. A release
# candidate is published as a pre-release. Its notes list every commit that came into main since the
# version before (scripts/release.ts notes), pushed to main or merged from a pull request.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Today's date in Taiwan: YYYY-MM-DD for a release, then .1, .2… for the same day's patches; -rc after either for a release candidate of it, then .1, .2… for its patches (npm run release:next prints them)"
        required: true
        type: string

permissions:
  contents: read

# One release at a time, so that two runs cannot take the same version.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # The day of a release, and so its version, is the day in this time zone (RELEASE_TIME_ZONE in
  # scripts/release.ts).
  RELEASE_TIME_ZONE: Asia/Taipei

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check the version and the code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      title: ${{ steps.version.outputs.title }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      today: ${{ steps.version.outputs.today }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # First, so that a wrong version fails in seconds. The version reaches the script through the
      # environment, never inside the command line itself (no script injection).
      - name: Check the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/release.ts check "$VERSION" --remote

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  build:
    name: Build (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS
            os: macos-latest
            # Macs with Apple Silicon only (the runner's own processor).
            target: --mac dmg --arm64
          - name: Windows
            os: windows-latest
            target: --win nsis --x64
          # Built on an Arm runner, so that npm installs the keyring module's native part for Arm
          # (@napi-rs/keyring-win32-arm64-msvc) and the packaged app's own check runs natively. On a
          # Dev Drive (the step "Make a Dev Drive to build on" below).
          - name: Windows Arm64
            os: windows-11-arm
            target: --win nsis --arm64
            devDrive: true
          - name: Linux
            os: ubuntu-latest
            target: --linux AppImage --x64
          # The same for Linux on Arm (@napi-rs/keyring-linux-arm64-gnu).
          - name: Linux Arm64
            os: ubuntu-24.04-arm
            target: --linux AppImage --arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # The version the app is built as (desktop/scripts/build.ts) and its installers are named after.
      RELAY_VERSION: ${{ needs.check.outputs.tag }}
      # Where it is built: the checkout, or its copy on a Dev Drive.
      BUILD_DIR: ${{ matrix.devDrive && 'R:\harness-relay' || github.workspace }}
    # These replace the workflow's defaults, so bash is named again.
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.BUILD_DIR }}
    steps:
      - uses: actions/checkout@v7

      # GitHub's Windows on Arm runner has one disk, which writes small files about 14 times slower
      # than a Dev Drive does (x64's runner builds on a fast disk of its own), and npm ci writes tens of
      # thousands: there the job builds in a copy of the checkout on a Dev Drive, with npm's cache and
      # the temporary folder, which makes installing about twice as fast. It holds only this job's
      # files, so no antivirus filter is attached to it.
      - name: Make a Dev Drive to build on
        if: matrix.devDrive
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          New-VHD -Path (Join-Path $env:RUNNER_TEMP 'dev-drive.vhdx') -SizeBytes 20GB -Dynamic | Mount-VHD -PassThru |
            Initialize-Disk -PassThru | New-Partition -DriveLetter R -UseMaximumSize | Format-Volume -DevDrive -Confirm:$false -Force | Out-Null
          fsutil devdrv enable /disallowAv
          fsutil devdrv trust /f R:
          Copy-Item -Path $env:GITHUB_WORKSPACE -Destination $env:BUILD_DIR -Recurse -Force
          New-Item -ItemType Directory -Path R:\npm-cache, R:\tmp | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value 'npm_config_cache=R:\npm-cache', 'TEMP=R:\tmp', 'TMP=R:\tmp'

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install
        run: npm ci

      # electron-builder downloads the Electron it packages by itself.
      - name: Install the desktop app's tools
        run: npm ci --prefix desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build the web app
        run: npm run build

      - name: Build the desktop app
        run: npm --prefix desktop run build

      # On each system: the bundled server listens, signs a browser in, has a team of the fake CLIs
      # (e2e/fake-cli/) answer a question and stops as the app needs.
      - name: Run the bundled server as the desktop app does
        run: npx tsx desktop/scripts/smoke.ts

      # Not signed for distribution: on macOS the app is signed ad hoc (desktop/electron-builder.yml;
      # Apple Silicon runs nothing unsigned), and no identity is looked for in the keychain.
      # The installers are named after the version: Harness-Relay-<version>-<os>-<arch>.<ext>.
      - name: Make the installer
        working-directory: ${{ env.BUILD_DIR }}/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.target }} --publish never -c.artifactName='Harness-Relay-${env.RELAY_VERSION}-${os}-${arch}.${ext}'

      # The packaged app itself, as it ships (desktop/scripts/check-package.ts): its fuses, the keyring
      # module in its resources, and its own check in Electron (--smoke-test: the server in a utility
      # process, a question answered by a team of the fake CLIs, a sandboxed window signed in). On
      # Linux it needs a display.
      - name: Check the packaged app
        if: runner.os != 'Linux'
        run: npx tsx desktop/scripts/check-package.ts

      - name: Check the packaged app (Linux, on a virtual display)
        if: runner.os == 'Linux'
        run: |
          # A virtual display and Electron's own libraries: GitHub's x64 image has them, its Arm image not all.
          missing=$(for p in xvfb libnss3 libgtk-3-0t64 libgbm1 libasound2t64; do dpkg -s "$p" >/dev/null 2>&1 || echo "$p"; done)
          if [ -n "$missing" ]; then sudo apt-get update -q && sudo apt-get install -y -q $missing; fi
          xvfb-run -a npx tsx desktop/scripts/check-package.ts

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.name }}
          path: |
            ${{ env.BUILD_DIR }}/desktop/release/Harness-Relay-*.dmg
            ${{ env.BUILD_DIR }}/desktop/release/Harness-Relay-*.exe
            ${{ env.BUILD_DIR }}/desktop/release/Harness-Relay-*.AppImage
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Again, against the tags as they are now and the day the run started (a long build may end
      # after midnight): another release may have taken the version meanwhile.
      - name: Check the version again
        env:
          VERSION: ${{ needs.check.outputs.tag }}
          TODAY: ${{ needs.check.outputs.today }}
        run: node scripts/release.ts check "$VERSION" --remote --today "$TODAY"

      # The notes' list of changes: every commit that came into main since the version the notes
      # start from (previousVersion() in scripts/release.ts, by the same tags), up to the commit that
      # was checked and built, whether pushed to main or merged from a pull request, as GitHub's
      # comparison of the two lists them; each by its subject, linked to the pull request it merged or
      # else to itself. Before anything is published, so that a failure here publishes nothing.
      - name: List the changes since the version before
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.tag }}
        run: node scripts/release.ts notes "$VERSION" --target "$GITHUB_SHA" --remote > "$RUNNER_TEMP/changes.md"

      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true

      # The ends of the installers' names are the ones the website and the app's updates look for
      # (INSTALLERS in site/assets/downloads.js).
      - name: Expect one installer per system and processor
        run: |
          ls -l installers
          ends=$(node --input-type=module -e "import { INSTALLERS } from './site/assets/downloads.js'; console.log(Object.values(INSTALLERS).join('\n'))")
          total=0
          for end in $ends; do
            count=$(find installers -maxdepth 1 -name "*$end" | wc -l)
            if [ "$count" -ne 1 ]; then
              echo "::error::Expected one installer ending in $end, found $count."
              exit 1
            fi
            total=$((total + 1))
          done
          if [ "$(find installers -maxdepth 1 -type f | wc -l)" -ne "$total" ]; then
            echo "::error::Expected $total installers, found others too."
            exit 1
          fi

      # The same installers again for the app's own updates, which download these instead
      # (UPDATE_INSTALLERS in site/assets/downloads.js): GitHub's download counts then tell new
      # installs from updates of an installed app. In a folder of their own: they are published in
      # another repository, so that the release page lists the installers alone.
      - name: Copy the installers for the app's updates
        run: |
          mkdir updates
          node --input-type=module -e "
          import { copyFileSync, readdirSync } from 'node:fs';
          import { updateCopyName } from './site/assets/downloads.js';
          for (const name of readdirSync('installers')) {
            const copy = updateCopyName(name);
            if (!copy) throw new Error('Not an installer: ' + name);
            copyFileSync('installers/' + name, 'updates/' + copy);
          }"
          ls -l updates

      # Before the release, so that no app is offered it before its copies are there (it would download
      # the installer itself, counted as a new install). Under the same tag in the public repository
      # UPDATES_REPO (site/assets/downloads.js), with a token that may write there alone (UPDATES_TOKEN,
      # see docs/developer-guide.md, "Releasing"): this job's own token writes to this repository only.
      # A run tried again uploads the copies again.
      - name: Publish the copies for the app's updates
        env:
          GH_TOKEN: ${{ secrets.UPDATES_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
          TITLE: ${{ needs.check.outputs.title }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The UPDATES_TOKEN secret is not set (docs/developer-guide.md, \"Releasing\")."
            exit 1
          fi
          repo=$(node --input-type=module -e "import { UPDATES_REPO } from './site/assets/downloads.js'; console.log(UPDATES_REPO)")
          if gh release view "$TAG" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$TAG" updates/* --repo "$repo" --clobber
          else
            channel=(--latest)
            if [ "$PRERELEASE" = true ]; then channel=(--prerelease --latest=false); fi
            notes="Copies of the installers of [$TITLE](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}), which an installed Harness Relay downloads to update itself. To install Harness Relay, download the installers there."
            gh release create "$TAG" updates/* --repo "$repo" --title "$TITLE" --notes "$notes" "${channel[@]}"
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          TITLE: ${{ needs.check.outputs.title }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            channel=(--prerelease --latest=false)
            kind='A release candidate: try it before the release.'
            offered='A Harness Relay that is a release candidate (or a build of your own) offers this one in its menu (**Update to …**) and in its chat, and updates itself; a release is offered releases only.'
          else
            channel=(--latest)
            kind='A release.'
            offered='A Harness Relay already installed offers this release in its menu (**Update to …**) and in its chat, and updates itself.'
          fi
          notes="$kind

          **Download:** \`.dmg\` for macOS 13 or later on Apple Silicon (no Intel Macs), \`.exe\` for Windows 10 or later (\`win-x64\`, or \`win-arm64\` for Windows on Arm), \`.AppImage\` for Linux (\`linux-x86_64\`, or \`linux-arm64\` for Arm). The installers are not signed yet: on macOS, open **System Settings → Privacy & Security** and click **Open Anyway**; on Windows, click **More info → Run anyway**; on Linux, make the AppImage executable, and on Ubuntu 24.04 and later start it with \`--no-sandbox\`. $offered See [Desktop app](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/user-guide.md#desktop-app) ([繁體中文](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/user-guide.zh-TW.md#桌面-app))."
          # Then the changes since the version before (for a release, the release before it, its release
          # candidates' changes included; for a release candidate, the version before it, release or
          # release candidate), listed by the step above.
          printf '%s\n\n' "$notes" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/changes.md" >> "$RUNNER_TEMP/notes.md"
          # The tag is made on the commit that was checked and built.
          gh release create "$TAG" installers/* --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" "${channel[@]}"
